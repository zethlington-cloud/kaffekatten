<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaffekatten Kassa</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1e1e1e;
            --card-active: #2a2a2a;
            --text: #ffffff;
            --text-dim: #a0a0a0;
            --accent: #ffb3e3;
            --danger: #ff5f5f;
        }

        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px 20px 220px 20px; 
        }

        h2 { border-bottom: 2px solid var(--accent); padding-bottom: 10px; }

        .item-row { 
            background: var(--card); 
            padding: 4px 10px; 
            border-radius: 16px; 
            margin-bottom: 4px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            border: 2px solid transparent;
        }

        .item-row.has-items { border-color: var(--accent); background: var(--card-active); }

        .item-info strong { display: block; font-size: 1.05rem; }
        .item-info small { color: var(--text-dim); }

        .controls { display: flex; align-items: center; gap: 10px; }

        .step-btn { 
            background: var(--accent); 
            border: none; 
            color: #000; 
            font-weight: bold;
            width: 34px; height: 30px; 
            border-radius: 10px; 
            font-size: 20px; 
            cursor: pointer;
        }

        .qty-input {
            width: 50px; height: 30px;
            background: #333; border: 1px solid #444;
            color: white; text-align: center;
            font-size: 1.2rem; font-weight: bold;
            border-radius: 8px;
        }

        .discount-container {
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card);
            padding: 15px;
            border-radius: 12px;
        }

        .discount-options { display: flex; gap: 8px; }

        .toggle-btn {
            background: #333;
            color: var(--text-dim);
            border: 2px solid #444;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .toggle-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .footer { 
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(15, 15, 15, 0.98); 
            padding: 20px; border-top: 1px solid #333;
        }

        .total-box { font-size: 2rem; font-weight: bold; color: var(--accent); display: flex; justify-content: space-between; }
        .sub-box { font-size: 0.9rem; color: var(--text-dim); display: flex; justify-content: space-between; margin-bottom: 5px;}

        .btn-clear { 
            width: 100%; margin-top: 15px; background: transparent; 
            color: var(--danger); border: 1px solid var(--danger); 
            padding: 10px; border-radius: 8px; cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Kaffekatten Kassa</h2>
    
    <div id="item-list">
        <div class="item-row" data-price="400">
            <div class="item-info"><strong>Kawaii Djurbröd</strong><small>400kr</small></div>
            <div class="controls">
                <button class="step-btn" onclick="step(this, -1)">-</button>
                <input type="number" class="qty-input" value="0" oninput="updateRow(this)" onclick="this.select()">
                <button class="step-btn" onclick="step(this, 1)">+</button>
            </div>
        </div>

        <div class="item-row" data-price="300">

                <button class="step-btn" onclick="step(this, 1)">+</button>
            </div>
        </div>

        <div class="item-row" data-price="120">

                <button class="step-btn" onclick="step(this, 1)">+</button>
            </div>
        </div>
        
        <div class="item-row" data-price="120">
            <div class="item-info"><strong>Chokladglass</strong><small>120kr</small></div>
            <div class="controls">
                <button class="step-btn" onclick="step(this, -1)">-</button>
                <input type="number" class="qty-input" value="0" oninput="updateRow(this)" onclick="this.select()">
                <button class="step-btn" onclick="step(this, 1)">+</button>

        </div>

        </div>

            <div class="item-info"><strong>Matcha Boba</strong><small>100kr</small></div>
            <div class="controls">
                <button class="step-btn" onclick="step(this, -1)">-</button>
                <input type="number" class="qty-input" value="0" oninput="updateRow(this)" onclick="this.select()">
                <button class="step-btn" onclick="step(this, 1)">+</button>
            </div>
        </div>

        <div class="item-row" data-price="100">
            <div class="item-info"><strong>Coffee Milk Boba</strong><small>100kr</small></div>
            <div class="controls">
                <button class="step-btn" onclick="step(this, -1)">-</button>
                <input type="number" class="qty-input" value="0" oninput="updateRow(this)" onclick="this.select()">
                <button class="step-btn" onclick="step(this, 1)">+</button>
            </div>
        </div>

        <div class="item-row" data-price="75">
            <div class="item-info"><strong>Svart Te</strong><small>75kr</small></div>
            <div class="controls">
                <button class="step-btn" onclick="step(this, -1)">-</button>
                <input type="number" class="qty-input" value="0" oninput="updateRow(this)" onclick="this.select()">
                <button class="step-btn" onclick="step(this, 1)">+</button>
            </div>
        </div>
    </div>

    <div class="discount-container">
        <span>Rabatt</span>
        <div class="discount-options">
            <button id="btn-0" class="toggle-btn active" onclick="setDiscount(0)">0%</button>
            <button id="btn-10" class="toggle-btn" onclick="setDiscount(10)">10%</button>
            <button id="btn-20" class="toggle-btn" onclick="setDiscount(20)">20%</button>
        </div>
    </div>

    <div class="footer">
        <div class="sub-box"><span>Delsumma:</span> <span><span id="subtotal">0</span> kr</span></div>
        <div class="total-box"><span>TOTALT:</span> <span><span id="grand-total">0</span> kr</span></div>
        <button class="btn-clear" onclick="resetAll()">Töm Beställning</button>
    </div>

    <script>
        let currentDiscount = 0;

        // FIXED: Re-added the step function
        function step(btn, delta) {
            const input = btn.parentElement.querySelector('.qty-input');
            let val = (parseInt(input.value) || 0) + delta;
            input.value = val < 0 ? 0 : val;
            updateRow(input);
        }

        function updateRow(input) {
            const row = input.closest('.item-row');
            const val = parseInt(input.value) || 0;
            if (val > 0) row.classList.add('has-items');
            else row.classList.remove('has-items');
            calculate();
        }

        // NEW: Handles switching between 0, 10, and 20%
        function setDiscount(percent) {
            currentDiscount = percent;
            document.querySelectorAll('.discount-options .toggle-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById('btn-' + percent).classList.add('active');
            calculate();
        }

        function calculate() {
            let subtotal = 0;
            document.querySelectorAll('.item-row').forEach(row => {
                const price = parseInt(row.dataset.price);
                const qty = parseInt(row.querySelector('.qty-input').value) || 0;
                subtotal += price * qty;
            });

            // Apply the chosen percentage
            let multiplier = (100 - currentDiscount) / 100;
            let finalTotal = subtotal * multiplier;

            document.getElementById('subtotal').innerText = subtotal;
            document.getElementById('grand-total').innerText = Math.round(finalTotal);
        }

        function resetAll() {
            if(confirm("Rensa allt?")) {
                document.querySelectorAll('.qty-input').forEach(i => i.value = 0);
                document.querySelectorAll('.item-row').forEach(r => r.classList.remove('has-items'));
                setDiscount(0);
                calculate();
            }
        }
    </script>
</body>
</html>
